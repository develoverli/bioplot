name: Pools history

# Appends the newest settled reward-pool blocks to public/pools-history.json, read straight
# off the chain's public explorer, and commits the file when something new settled. Pages
# redeploys on the push, so the app serves months of history instantly and only asks the
# chain for what is newer. No account, no token, no server. See docs/market-rate.md.
#
# Blocks close every four hours at :49 UTC; running hourly at :57 catches each close a few
# minutes after its payouts land, and the runs in between fill the window in behind it until
# the file holds the target (50 blocks, about eight days of history).
#
# GitHub can delay the first scheduled run of a brand-new workflow by up to an hour, so seed
# it once by hand: Actions, Pools history, Run workflow.

on:
  schedule:
    - cron: '57 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'How many settled blocks the file should hold'
        required: false
        default: '50'
      max:
        description: 'Blocks to read in this run (about 80 seconds each)'
        required: false
        default: '20'

permissions:
  contents: write

concurrency:
  group: pools-history
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Newest first, then backwards, so an hourly schedule reaches a full window in a day.
      - name: Read blocks from the explorer
        timeout-minutes: 50
        run: >
          node scripts/pools-history.mjs
          --target ${{ github.event.inputs.target || '50' }}
          --max ${{ github.event.inputs.max || '8' }}

      - name: Commit when the snapshot changed
        run: |
          if git diff --quiet -- public/pools-history.json; then
            echo "snapshot unchanged"
            exit 0
          fi
          NEWEST=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/pools-history.json','utf8')).blocks[0].closeAt)")
          git config user.name "bioplot-bot"
          git config user.email "bioplot-bot@users.noreply.github.com"
          git add public/pools-history.json
          git commit -m "🤖 data(pools): blocks up to ${NEWEST}"
          git push
